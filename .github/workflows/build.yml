name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore DefinetlyNotAFishingBot.sln

      - name: Build (Release)
        run: msbuild DefinetlyNotAFishingBot.sln /p:Configuration=Release /m

      - name: Self test
        run: ./DefinetlyNotAFishingBot/bin/Release/DefinetlyNotAFishingBot.exe --selftest

      - name: Package
        shell: pwsh
        run: |
          $out = "DefinetlyNotAFishingBot/bin/Release"
          Compress-Archive -Path "$out/DefinetlyNotAFishingBot.exe","$out/DefinetlyNotAFishingBot.exe.config","$out/Newtonsoft.Json.dll" -DestinationPath DefinetlyNotAFishingBot.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DefinetlyNotAFishingBot
          path: DefinetlyNotAFishingBot.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DefinetlyNotAFishingBot.zip
